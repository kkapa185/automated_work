[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "Minimal scalar autograd engine and neural-network library for teaching backpropagation"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
torch = ["torch"]

[tool.setuptools]
packages = ["micrograd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
