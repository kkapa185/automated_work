[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itsdangerous"
version = "2.0.0"
description = "Cryptographically signed data for untrusted channels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["itsdangerous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
