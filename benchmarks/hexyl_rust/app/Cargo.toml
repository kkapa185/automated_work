[package]
name = "hexyl"
version = "0.1.0"
edition = "2021"
description = "A colourful command-line hex viewer"

[lib]
name = "hexyl"
path = "src/lib.rs"

[[bin]]
name = "hexyl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
terminal_size = "0.4"

[profile.release]
opt-level = 3
