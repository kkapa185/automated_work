<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Project Explorer</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--muted:#5b6475;--card:#fff;--line:#d9dde5;--accent:#0b5fff;--chip:#e6eeff;
--beg:#1b7f3b;--int:#9a6700;--adv:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ebf2;--muted:#9aa3b5;--card:#1b2029;--line:#2e3543;--accent:#6ea0ff;--chip:#24335a;
--beg:#5fd081;--int:#e8b84a;--adv:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0 0 10px;font-size:20px}
#q{width:100%;max-width:560px;padding:9px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.layout{display:flex;gap:20px;padding:16px;align-items:flex-start}
aside{flex:0 0 270px;max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:8px}
main{flex:1;min-width:0}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:6px 10px;background:var(--card)}
legend{font-weight:600;padding:0 4px}
label.opt{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer}
label.opt .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:13px}
.chip::after{content:" \00d7"}
#count{font-weight:600;margin:0 0 10px}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;height:140px;object-fit:cover;border-radius:6px;background:var(--line)}
.card h2{font-size:16px;margin:0}
.card a{color:var(--accent);text-decoration:none}
.card p{margin:0;color:var(--muted)}
.badge{align-self:flex-start;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px}
.badge.Beginner{color:var(--beg)}.badge.Intermediate{color:var(--int)}.badge.Advanced{color:var(--adv)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.tag.trend{border-color:var(--accent)}
#empty{color:var(--muted)}
@media (max-width:760px){.layout{flex-direction:column}aside{flex:none;position:static;max-height:none;width:100%}}
</style>
</head>
<body>
<header>
  <h1>MATLAB &amp; Simulink Challenge Project Explorer</h1>
  <input id="q" type="search" placeholder="Search title, summary, expertise, products…" aria-label="Search projects" autocomplete="off">
</header>
<div class="layout">
  <aside id="facets" aria-label="Filters"></aside>
  <main>
    <div id="chips" aria-label="Active filters"></div>
    <p id="count" aria-live="polite"></p>
    <div id="results"></div>
    <p id="empty" hidden>No projects match the current filters.</p>
  </main>
</div>
<script>
(function(){
"use strict";
var FACETS=[["difficulty","Difficulty"],["technology_trend","Technology trend"],["product","MathWorks product"],
["platform","Platform"],["project_type","Project type"],["application_area","Application area"],
["hardware_required","Hardware required"],["partner","Industry partner"],["has_partner","Has partner"]];
var PARAMS=["q"].concat(FACETS.map(function(f){return f[0];}));
var state={};                       // param -> array of values ("q" -> [text])
var seq=0;

function readURL(){
  var sp=new URLSearchParams(location.search);state={};
  PARAMS.forEach(function(p){
    var v=sp.getAll(p).filter(function(x){return x!=="";});
    if(p==="q"&&v.length)v=[v.join(" ")];
    if(v.length)state[p]=v;
  });
}
function query(){
  var sp=new URLSearchParams();
  PARAMS.forEach(function(p){(state[p]||[]).forEach(function(v){sp.append(p,v);});});
  return sp.toString();
}
function writeURL(push){
  var qs=query(),url=location.pathname+(qs?"?"+qs:"");
  if(url!==location.pathname+location.search){history[push?"pushState":"replaceState"](null,"",url);}
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function has(p,v){return (state[p]||[]).some(function(x){return x.toLowerCase()===v.toLowerCase();});}
function toggle(p,v,on){
  var cur=(state[p]||[]).filter(function(x){return x.toLowerCase()!==v.toLowerCase();});
  if(on)cur.push(v);
  if(cur.length)state[p]=cur;else delete state[p];
  writeURL(true);refresh();
}
function renderFacets(data){
  var box=document.getElementById("facets");box.textContent="";
  FACETS.forEach(function(f){
    var items=data[f[0]]||[];
    // keep selected values visible even when their count in the current view is 0
    (state[f[0]]||[]).forEach(function(v){
      if(!items.some(function(i){return i.value.toLowerCase()===v.toLowerCase();}))items=items.concat([{value:v,count:0}]);
    });
    if(!items.length)return;
    var fs=el("fieldset"),lg=el("legend",null,f[1]);fs.appendChild(lg);
    items.forEach(function(it){
      var lab=el("label","opt"),cb=el("input");cb.type="checkbox";
      cb.checked=has(f[0],it.value);cb.setAttribute("data-facet",f[0]);cb.value=it.value;
      cb.addEventListener("change",function(){toggle(f[0],it.value,cb.checked);});
      lab.appendChild(cb);lab.appendChild(el("span",null,it.value));lab.appendChild(el("span","n",String(it.count)));
      fs.appendChild(lab);
    });
    box.appendChild(fs);
  });
}
function renderChips(){
  var box=document.getElementById("chips");box.textContent="";
  PARAMS.forEach(function(p){
    (state[p]||[]).forEach(function(v){
      var label=(p==="q"?"Search":(FACETS.filter(function(f){return f[0]===p;})[0]||[0,p])[1])+": "+v;
      var b=el("button","chip",label);b.type="button";b.setAttribute("data-chip",p);b.title="Remove filter";
      b.addEventListener("click",function(){
        if(p==="q"){delete state.q;document.getElementById("q").value="";writeURL(true);refresh();}
        else toggle(p,v,false);
      });
      box.appendChild(b);
    });
  });
}
function tags(parent,items,cls){items.forEach(function(t){parent.appendChild(el("span","tag "+cls,t));});}
function renderCards(res){
  var box=document.getElementById("results");box.textContent="";
  res.projects.forEach(function(p){
    var c=el("article","card");c.setAttribute("data-project-id",p.id);
    if(p.thumbnail){var im=el("img");im.src=p.thumbnail;im.alt="";im.loading="lazy";c.appendChild(im);}
    var h=el("h2"),a=el("a",null,p.title);a.href=p.project_url;a.target="_blank";a.rel="noopener";h.appendChild(a);c.appendChild(h);
    c.appendChild(el("span","badge "+p.difficulty,p.difficulty));
    c.appendChild(el("p",null,p.summary));
    var t=el("div","tags");tags(t,p.technology_trends,"trend");tags(t,p.mathworks_products,"product");c.appendChild(t);
    box.appendChild(c);
  });
  document.getElementById("empty").hidden=res.projects.length>0;
  var n=res.count;document.getElementById("count").textContent=n+(n===1?" project":" projects");
}
function getJSON(url){return fetch(url).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j;});});}
function refresh(){
  var my=++seq,qs=query(),sfx=qs?"?"+qs:"";
  renderChips();
  document.getElementById("q").value=(state.q||[""])[0];
  return Promise.all([getJSON("/api/projects"+sfx),getJSON("/api/facets"+sfx)]).then(function(r){
    if(my!==seq)return;
    renderCards(r[0]);renderFacets(r[1]);document.body.setAttribute("data-ready","1");
  }).catch(function(e){
    if(my!==seq)return;
    document.getElementById("count").textContent="Error: "+e.message;document.body.setAttribute("data-ready","1");
  });
}
var timer=null;
document.getElementById("q").addEventListener("input",function(e){
  var v=e.target.value.trim();if(v)state.q=[v];else delete state.q;
  clearTimeout(timer);timer=setTimeout(function(){writeURL(false);refresh();},150);
});
window.addEventListener("popstate",function(){readURL();refresh();});
readURL();refresh();
})();
</script>
</body>
</html>
