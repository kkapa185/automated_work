[project]
name = "claude-task-orchestrator"
version = "1.0.0"
description = "Autonomous task orchestrator that drives a single claude CLI session per task"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
    "markdownify>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
